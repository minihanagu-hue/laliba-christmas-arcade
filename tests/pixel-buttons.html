<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelButton 狀態驗收</title><link rel="stylesheet" href="../pixel-button.css"><style>body{background:#19232a;color:#fff4d5;font:14px monospace;padding:24px}section{display:flex;gap:18px;flex-wrap:wrap;margin:24px 0}h2{width:100%;font-size:16px}p{line-height:1.8}</style><h1>PixelButton 狀態驗收</h1><p>每色依序：Default（滑鼠移入可驗 Hover）／Pressed（固定預覽）／Disabled。觸控第一顆可看下沉回饋。使用 Tab 檢查焦點。所有內容均為獨立測試，不讀寫玩家資料。</p><section><h2>green</h2><button class="pixel-button " data-pixel-tone="green" >Default</button><button class="pixel-button is-pressed" data-pixel-tone="green" >Pressed</button><button class="pixel-button " data-pixel-tone="green" disabled>Disabled</button></section><section><h2>red</h2><button class="pixel-button " data-pixel-tone="red" >Default</button><button class="pixel-button is-pressed" data-pixel-tone="red" >Pressed</button><button class="pixel-button " data-pixel-tone="red" disabled>Disabled</button></section><section><h2>blue</h2><button class="pixel-button " data-pixel-tone="blue" >Default</button><button class="pixel-button is-pressed" data-pixel-tone="blue" >Pressed</button><button class="pixel-button " data-pixel-tone="blue" disabled>Disabled</button></section><section><h2>gold</h2><button class="pixel-button " data-pixel-tone="gold" >Default</button><button class="pixel-button is-pressed" data-pixel-tone="gold" >Pressed</button><button class="pixel-button " data-pixel-tone="gold" disabled>Disabled</button></section><section><h2>cream</h2><button class="pixel-button " data-pixel-tone="cream" >Default</button><button class="pixel-button is-pressed" data-pixel-tone="cream" >Pressed</button><button class="pixel-button " data-pixel-tone="cream" disabled>Disabled</button></section>
